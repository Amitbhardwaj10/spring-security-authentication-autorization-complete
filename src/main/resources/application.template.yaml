spring:
  application:
    name: spring-security

  datasource:
    url: jdbc:mysql://localhost:3306/yourdb
    username: DB_USERNAME
    password: DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: "YOUR_SECRET_KEY_GOES_HERE"